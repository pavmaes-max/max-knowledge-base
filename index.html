        // Регулярный очиститель текстовых массивов Telegram
        function superCleanTelegramText(rawText) {
            let str = String(rawText).trim();
            
            if (str.includes("'text':") || str.includes('"text":')) {
                let regex = /(?:['"]text['"]\s*:\s*['"])(.*?)(?:['"])/g;
                let matches = [];
                let match;
                while ((match = regex.exec(str)) !== null) {
                    let chunk = match[1];
                    if (chunk !== 'plain' && chunk !== 'bold' && chunk !== 'italic' && chunk !== 'hashtag') {
                        matches.push(chunk);
                    }
                }
                if (matches.length > 0) {
                    return matches.join('').replace(/\\n/g, '\n').replace(/\\"/g, '"').trim();
                }
            }
