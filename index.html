<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Bot Knowledge Base</title>
    <!-- Подключение Telegram Web Apps API -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #707579;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .post-card {
            border-bottom: 1px solid var(--tg-theme-hint-color);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .post-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .post-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 8px;
            display: block;
        }
        .post-text {
            font-size: 1rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .error-message {
            color: red;
            text-align: center;
            margin-top: 20px;
        }
        .loading {
            text-align: center;
            color: var(--tg-theme-hint-color);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="app">
        <div id="loading" class="loading">Загрузка базы знаний...</div>
        <div id="content"></div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Конфигурация проекта
        const BASE_URL = "https://github.io"; // Адрес вашей базы знаний
        
        // Словарь точных заголовков из CSV-выгрузки (исправление багов отображения)
        const customTitles = {
            10: "Исследование Стэнфорда: Как ИИ меняет обучение",
            88: "Пост без тегов №88: Важное объявление",
            91: "Пост без тегов №91: Информационная заметка",
            92: "Пост без тегов №92: Дополнительные материалы"
        };

        // ID постов без изображений (Пост №2 и Пост №19 с бытовым ИИ/видео)
        const noImageIds =;

        // Массив ID постов без JSON-тегов, которые защищены от очистителя символов
        const protectedIds =;

        /**
         * Функция расчета имени файла изображения по ID поста
         * Логика смещения:
         * - id 2: без фото
         * - со 2-го поста (id > 2) смещение -1 (photo_1, photo_2...)
         * - id 19: видео, без фото
         * - после 19 поста (id > 19) смещение становится -2
         */
        function getImagePath(id) {
            if (noImageIds.includes(id)) {
                return null;
            }
            
            let photoNumber;
            if (id > 19) {
                photoNumber = id - 2;
            } else if (id > 2) {
                photoNumber = id - 1;
            } else {
                return null;
            }
            
            return `photos/photo_${photoNumber}.jpg`;
        }

        /**
         * Очиститель текста. Удаляет лишние технические символы, 
         * но игнорирует защищенные посты без JSON-тегов.
         */
        function cleanAndFormatText(text, id) {
            if (!text) return "";
            
            // Если пост защищен — отдаем текст в исходном виде (без затирания)
            if (protectedIds.includes(id)) {
                return text.trim();
            }

            let cleanedText = text;
            try {
                // Очиститель: убирает остаточные JSON-конструкции, фигурные скобки и служебный мусор
                cleanedText = cleanedText
                    .replace(/\{[^}]*\}/g, "") // Удаляет всё внутри фигурных скобок вместе с ними
                    .replace(/[\\"[\]]/g, "")   // Удаляет экраны, лишние кавычки и квадратные скобки
                    .replace(/\s+/g, " ");      // Схлопывает множественные пробелы
            } catch (e) {
                console.error("Ошибка при очистке текста для ID " + id, e);
            }
            
            return cleanedText.trim();
        }

        /**
         * Рендеринг полученных данных на страницу
         */
        function renderPosts(posts) {
            const contentDiv = document.getElementById("content");
            const loadingDiv = document.getElementById("loading");
            
            loadingDiv.style.display = "none";
            contentDiv.innerHTML = "";

            posts.forEach(post => {
                const postCard = document.createElement("div");
                postCard.className = "post-card";

                // Выбор заголовка: кастомный по ID или стандартный из data.json
                const titleText = customTitles[post.id] || post.title || `Пост #${post.id}`;
                
                const titleEl = document.createElement("div");
                titleEl.className = "post-title";
                titleEl.textContent = titleText;
                postCard.appendChild(titleEl);

                // Рендеринг изображений с учетом логики смещения
                const imagePath = getImagePath(post.id);
                if (imagePath) {
                    const imgEl = document.createElement("img");
                    imgEl.className = "post-image";
                    imgEl.src = `${BASE_URL}/${imagePath}`;
                    imgEl.alt = titleText;
                    
                    // Если картинки нет на сервере, скрываем элемент во избежание «битых» картинок
                    imgEl.onerror = function() {
                        this.style.display = 'none';
                    };
                    postCard.appendChild(imgEl);
                }

                // Обработка и вывод текста поста
                const textEl = document.createElement("div");
                textEl.className = "post-text";
                textEl.textContent = cleanAndFormatText(post.text, post.id);
                postCard.appendChild(textEl);

                contentDiv.appendChild(postCard);
            });
        }

        /**
         * Загрузка данных из файла data.json
         */
        async function loadData() {
            try {
                const response = await fetch(`${BASE_URL}/data.json`);
                if (!response.ok) {
                    throw new Error(`Ошибка загрузки данных: ${response.status}`);
                }
                const data = await response.json();
                
                // Извлекаем массив постов в зависимости от структуры json
                const posts = Array.isArray(data) ? data : data.posts || [];
                
                // Сортируем по возрастанию ID для корректной хронологии
                posts.sort((a, b) => a.id - b.id);
                
                renderPosts(posts);
            } catch (error) {
                console.error(error);
                document.getElementById("loading").style.display = "none";
                const contentDiv = document.getElementById("content");
                contentDiv.innerHTML = `<div class="error-message">Не удалось загрузить базу знаний. Проверьте файл data.json.</div>`;
            }
        }

        // Запуск логики после полной загрузки DOM-дерева
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
